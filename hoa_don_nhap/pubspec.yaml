name: hoa_don_nhap
description: "MVP quét và lưu hóa đơn nhập hàng cho cửa hàng tạp hóa — nhận dạng chữ (OCR) ngay trên điện thoại."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # OCR trên thiết bị (Android/iOS), không cần mạng, không cần API key
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  google_mlkit_barcode_scanning: ^0.16.1
  share_plus: ^13.3.1
  mobile_scanner: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mau/
    - assets/danh_thiep/
